[project]
name = "stockpilot"
version = "0.1.0"
description = "Backend with an AI agent (LangGraph) that reallocates new vehicle units across a dealer network."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=3.2.0",
    "langchain-ollama>=1.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
# Lets tests import the developer scripts (scripts/seed.py).
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "-m", "not eval"]
markers = [
    "integration: needs Docker (Testcontainers) to run a real PostgreSQL",
    "eval: agent regression evals against the real LLM; never run in CI",
]

[tool.coverage.run]
source = ["stockpilot"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15.0",
]


[tool.alembic]
script_location = "%(here)s/migrations"
# Date prefix keeps migration files listed in creation order.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"

# Autogenerated migrations are formatted and linted like the rest of the code.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
